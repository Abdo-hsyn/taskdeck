# Render blueprint — deploys the TaskDeck API.
# The client (Vercel) points at this service via VITE_API_URL.
services:
  - type: web
    name: taskdeck-api
    runtime: node
    region: frankfurt        # free instances: frankfurt or oregon
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false           # set in Render dashboard (TiDB connection string)
      - key: JWT_SECRET
        generateValue: true   # auto-generated, rotate if compromised
      - key: CLIENT_ORIGINS
        sync: false           # e.g. https://taskdeck.vercel.app,http://localhost:5173
      - key: PORT
        value: 10000
